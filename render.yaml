# Render Blueprint: New → Blueprint → pick this repo. Render builds the Dockerfile and asks
# for the values marked `sync: false`. Free plan: 512 MB, sleeps after 15 idle minutes.
services:
  - type: web
    name: paper-reader
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL          # Neon connection string (postgresql://... is fine)
        sync: false
      - key: QDRANT_URL            # Qdrant Cloud cluster URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JWT_SECRET            # random, generated by Render
        generateValue: true
