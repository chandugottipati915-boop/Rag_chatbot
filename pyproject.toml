[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.2",
    "deepeval>=4.3.3",
    "edgartools>=6.0.0",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "openai>=3.49.0",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rich>=14",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
    "typer>=0.29.0",
    "unstructured[pdf]>=0.27.37",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
